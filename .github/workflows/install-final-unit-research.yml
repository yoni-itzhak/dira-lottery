name: Diagnose final unit research payload

on:
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/deep-apartment-review
      - name: Print payload diagnostics
        run: |
          wc -c .research_payload_v2/chunk-*
          sha256sum .research_payload_v2/chunk-*
          cat .research_payload_v2/chunk-* | tr -d '\r\n ' > /tmp/final-unit-research.b64
          echo combined-base64:
          wc -c /tmp/final-unit-research.b64
          sha256sum /tmp/final-unit-research.b64
          base64 -d /tmp/final-unit-research.b64 > /tmp/final-unit-research.tar.xz || true
          echo decoded-tar:
          wc -c /tmp/final-unit-research.tar.xz
          sha256sum /tmp/final-unit-research.tar.xz
          xz -t /tmp/final-unit-research.tar.xz || true
          tar -tJf /tmp/final-unit-research.tar.xz || true
