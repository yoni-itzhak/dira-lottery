name: Save payload diagnostics

on:
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/deep-apartment-review
      - name: Save diagnostics
        run: |
          {
            echo 'chunk sizes:'
            wc -c .research_payload_v2/chunk-*
            echo 'chunk hashes:'
            sha256sum .research_payload_v2/chunk-*
            cat .research_payload_v2/chunk-* | tr -d '\r\n ' > /tmp/final-unit-research.b64
            echo 'combined base64:'
            wc -c /tmp/final-unit-research.b64
            sha256sum /tmp/final-unit-research.b64
            base64 -d /tmp/final-unit-research.b64 > /tmp/final-unit-research.tar.xz || true
            echo 'decoded tar:'
            wc -c /tmp/final-unit-research.tar.xz
            sha256sum /tmp/final-unit-research.tar.xz
            xz -t /tmp/final-unit-research.tar.xz && echo 'xz-valid=yes' || echo 'xz-valid=no'
          } > analysis/payload_diagnostics.txt
          rm -f .github/workflows/install-final-unit-research.yml
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Save research payload diagnostics"
          git push origin HEAD:analysis/deep-apartment-review
