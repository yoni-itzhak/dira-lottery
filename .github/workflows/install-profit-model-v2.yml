name: Install profit model v2

on:
  push:
    branches:
      - feature/profit-model-v2
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profit-model-v2

      - name: Check whether installation is needed
        id: check
        run: |
          if [ -d .profit_model_payload ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and verify payload
        if: steps.check.outputs.needed == 'true'
        run: |
          cat \
            .profit_model_payload/chunk-00 \
            .profit_model_payload/chunk-01 \
            .profit_model_payload/chunk-02x-* \
            .profit_model_payload/chunk-03 \
            .profit_model_payload/chunk-04x-* \
            .profit_model_payload/chunk-05 \
            .profit_model_payload/chunk-06x-* \
            > assembled-profit-model.b64
          base64 -d assembled-profit-model.b64 > /tmp/profit-model.tar.gz
          echo 'de623e2cdac24dd0114ee15d04456f4b0af27a75cdefc1293fb62e94378040f2  /tmp/profit-model.tar.gz' | sha256sum -c -
          tar -tzf /tmp/profit-model.tar.gz > /tmp/profit-model-manifest.txt
          test -s /tmp/profit-model-manifest.txt

      - name: Install model
        if: steps.check.outputs.needed == 'true'
        run: |
          tar -xzf /tmp/profit-model.tar.gz -C .
          rm -rf .profit_model_payload
          rm -f .github/workflows/validate-app.yml
          rm -f assembled-profit-model.b64 assembled-profit-model.sha256

      - name: Build app
        if: steps.check.outputs.needed == 'true'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Commit model
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Integrate calibrated profit model [profit model installed]"
          git push origin HEAD:feature/profit-model-v2
