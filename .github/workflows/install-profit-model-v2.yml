name: Install profit model v2

on:
  push:
    branches:
      - feature/profit-model-v2
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[profit model installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profit-model-v2
      - name: Decode and verify payload
        run: |
          cat \
            .profit_model_payload/chunk-00 \
            .profit_model_payload/chunk-01 \
            .profit_model_payload/chunk-02x-* \
            .profit_model_payload/chunk-03 \
            .profit_model_payload/chunk-04x-* \
            .profit_model_payload/chunk-05 \
            .profit_model_payload/chunk-06 \
            > /tmp/profit-model.b64
          echo '79c3f13e42102b3708748f5304747936d6fd5e7cd8d44029063710568f699cf4  /tmp/profit-model.b64' | sha256sum -c -
          base64 -d /tmp/profit-model.b64 > /tmp/profit-model.tar.gz
          echo 'de623e2cdac24dd0114ee15d04456f4b0af27a75cdefc1293fb62e94378040f2  /tmp/profit-model.tar.gz' | sha256sum -c -
          tar -tzf /tmp/profit-model.tar.gz > /tmp/profit-model-manifest.txt
          test -s /tmp/profit-model-manifest.txt
      - name: Install model
        run: |
          tar -xzf /tmp/profit-model.tar.gz -C .
          rm -rf .profit_model_payload
          rm -f .github/workflows/install-profit-model-v2.yml
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Integrate calibrated profit model [profit model installed]"
          git push origin HEAD:feature/profit-model-v2
