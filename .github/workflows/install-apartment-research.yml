name: Export apartment research sources

on:
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/apartment-research-v1
      - name: Build diagnostic bundle
        run: |
          mkdir -p export_bundle
          cp -R .research_payload export_bundle/research_payload
          cp -R app/public export_bundle/public
          cp -R app/src export_bundle/src
          if [ -d data ]; then cp -R data export_bundle/data; fi
          find export_bundle -type f | sort > export_bundle/manifest.txt
      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: apartment-research-sources
          path: export_bundle
          retention-days: 3
