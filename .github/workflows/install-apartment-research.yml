name: Install apartment research

on:
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/apartment-research-v1
      - name: Decode and validate research payload
        run: |
          cat .research_payload/xz-* > /tmp/research.b64
          base64 -d /tmp/research.b64 > /tmp/research.tar.xz
          tar -tJf /tmp/research.tar.xz > /tmp/research-manifest.txt
          test -s /tmp/research-manifest.txt
      - name: Install research
        run: |
          tar -xJf /tmp/research.tar.xz -C .
          rm -rf .research_payload
          rm -f .github/workflows/install-apartment-research.yml
      - name: Commit research files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add deep apartment research [research installed]"
          git push origin HEAD:analysis/apartment-research-v1
