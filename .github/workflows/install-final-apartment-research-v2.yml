name: Install final apartment research v2

on:
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/final-apartment-research-v2
      - name: Decode and verify research package
        run: |
          cat .final_research_payload/chunk-* > /tmp/final-research.b64
          echo '03235e5448ea72f41887aca15d5cfcba833df1b944662121a5655f5833c2735a  /tmp/final-research.b64' | sha256sum -c -
          base64 -d /tmp/final-research.b64 > /tmp/final-research.tar.xz
          echo 'f9ed03328bad3958ec18a7e0c4184c5481dab60ed95062b00f6484b671bfac2c  /tmp/final-research.tar.xz' | sha256sum -c -
          xz -t /tmp/final-research.tar.xz
      - name: Install final research files
        run: |
          mkdir -p analysis/final-apartment-research
          tar -xJf /tmp/final-research.tar.xz -C analysis/final-apartment-research
          rm -rf .final_research_payload
          rm -f .github/workflows/install-final-apartment-research-v2.yml
      - name: Commit installed research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add final apartment unit research'
          git push origin HEAD:analysis/final-apartment-research-v2
