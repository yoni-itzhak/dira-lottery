name: Export plan analysis bundle

on:
  pull_request:
    branches:
      - claude/session-dcup8f

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build analysis bundle
        run: |
          mkdir -p analysis_bundle
          cp -R app/public/plans analysis_bundle/plans
          cp app/src/data.js analysis_bundle/data.js
          cp app/src/reviews.js analysis_bundle/reviews.js
          find . -type f \
            \( -iname '*.pdf' -o -iname '*.dwfx' -o -iname '*.csv' -o -iname '*.json' -o -iname '*.txt' -o -iname '*.py' \) \
            -not -path './.git/*' -not -path './app/node_modules/*' -print0 | while IFS= read -r -d '' f; do
              mkdir -p "analysis_bundle/source/$(dirname "$f")"
              cp "$f" "analysis_bundle/source/$f"
            done
          find . -maxdepth 5 -type f -not -path './.git/*' | sort > analysis_bundle/repository_manifest.txt
          find analysis_bundle -type f | sort > analysis_bundle/manifest.txt
      - name: Upload analysis bundle
        uses: actions/upload-artifact@v4
        with:
          name: apartment-plan-analysis-bundle
          path: analysis_bundle
          retention-days: 3
